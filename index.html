<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vestra Connect | Modern Jordan Investment & Deal Platform</title>
    <meta name="description" content="Transform raw founder visions into verified, investment-ready opportunities across Jordan and MENA with intelligent matching and secure deal rooms." />
    <meta property="og:title" content="Vestra Connect | Modern Jordan Investment & Deal Platform" />
    <meta property="og:description" content="Transform raw founder visions into verified, investment-ready opportunities across Jordan and MENA with intelligent matching and secure deal rooms." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply saved language and theme before first paint to avoid a flash.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var l = q.get('lang') || localStorage.getItem('vc-lang');
          var t = q.get('theme') || localStorage.getItem('vc-theme');
          var d = document.documentElement;
          if (l === 'ar') { d.lang = 'ar'; d.dir = 'rtl'; }
          if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          d.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
